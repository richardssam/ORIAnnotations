settings:
  executables:
    xstudio: "/Users/sam/git/xstudio/build/xSTUDIO.app/Contents/MacOS/xstudio.bin"
    xstudio_python: "/Users/sam/git/xstudio/build/vcpkg_installed/arm-osx/tools/python3/python3"
    openrv: "/Applications/openRV.app/Contents/MacOS/RV"
  openrv_args: ["-geometry", "10", "50", "720", "400"]


# Canonical test media — generated by test_media/create_test_media.sh
# Run that script once before executing tests that reference these paths.
media:
  encoded:
    sparks:   "test_media/source/encoded_notc/sparks.mov"
    laser:    "test_media/source/encoded_notc/laser_ACES_sRGB.mov"
    car:      "test_media/source/encoded_notc/car_ACES_sRGB.mov"
    warp:     "test_media/source/encoded_notc/warp_ACES_sRGB.mov"
    graphic:  "test_media/source/encoded_notc/graphic_ACES_sRGB.mov"
  frames:
    sparks:   "test_media/source/frames/sparks/sparks_ACES2065-1.%05d.exr"
    laser:    "test_media/source/frames/laser/laser_ACES2065-1.%08d.exr"
    car:      "test_media/source/frames/car/car_ACES2065-1.%08d.exr"
    warp:     "test_media/source/frames/warp/warp_ACES2065-1.%08d.exr"
    graphic:  "test_media/source/frames/graphic/graphic_ACES2065-1.%08d.exr"

tests:
  - name: "http_media_fallback"
    description: >
      The client peer's media_roots entry deliberately lacks car_ACES_sRGB.mov
      locally (host's entry has it), so the client can only resolve the clip
      through the http_fallback OTIO media_linker plugin serving from
      media_http_base_url. Verifies the linker (openspec/changes/http-media-fallback)
      actually gets exercised end to end: the client's media_path must be the
      http URL and both peers must still converge on the same clip/frame.
      Requires sync_test/run_http_media_fallback_test.py's media server to be
      running (it starts one itself) on the port matching media_http_base_url.
    script_driven: true
    commands:
      - action: "add_media"
        url: "test_media/source/encoded/car_ACES_sRGB.mov"
      - action: "wait_for_media"
        timeout: 20.0
      - action: 'set_selection'
        name: "car_ACES_sRGB.mov"
      - action: "expect_media_path_prefix"
        app: "openrv"
        prefix: "http://127.0.0.1:8899"
        settle: 15.0
    media_roots:
      - "test_media/source/encoded"
      - "test_media/source/frames/car"
    media_http_base_url: "http://127.0.0.1:8899"
    apps:
      - "xstudio"
      - "openrv"
  - name: "xstudio_vs_openrv_basic_annotation_notc"
    recording: "recordings/single_clip_annotation_notc.jsonl"
    checkpoint_validation_delay: 2.5
    apps:
      - "xstudio"
      - "openrv"
  - name: "add_media"
    recording: "recordings/add_media_v2.jsonl"
    script_driven: true
    apps:
      - "xstudio"
      - "openrv"
  - name: "delete_media_openrv_noscript"
    recording: "recordings/delete_media_v2.jsonl"
    script_driven: false
    apps:
      - "xstudio"
      - "xstudio"
  - name: "delete_media_openrv"
    script_driven: true
    commands:
      - action: "add_media"
        url: "test_media/source/encoded_notc/car_ACES_sRGB.mov"
      - action: "add_media"
        url: "test_media/source/encoded_notc/graphic_ACES_sRGB.mov"
      - action: 'set_selection'
        name: "car_ACES_sRGB.mov"
      - action: "delete_media"
        name: "graphic_ACES_sRGB.mov"
      - action: 'set_selection'
        name: "car_ACES_sRGB.mov"
    apps:
      - "xstudio"
      - "openrv"
  - name: "delete_media_xstudio"
    #recording: "recordings/delete_media_notc.jsonl"
    script_driven: true
    commands:
      - action: "add_media"
        url: "test_media/source/encoded_notc/car_ACES_sRGB.mov"
      - action: "add_media"
        url: "test_media/source/encoded_notc/graphic_ACES_sRGB.mov"
      - action: 'set_selection'
        name: "car_ACES_sRGB.mov"
      - action: "delete_media"
        name: "graphic_ACES_sRGB.mov"
      - action: 'set_selection'
        name: "car_ACES_sRGB.mov"
    apps:
      - "xstudio"
      - "openrv"
  - name: "reorder_media"
    recording: "recordings/reorder_media_v2.jsonl"
    script_driven: false
    checkpoint_validation_delay: 4.5
    apps:
      - "xstudio"
      - "openrv"
  - name: "xstudio_selects"
    recording: "recordings/xstudio_selects.jsonl"
    script_driven: true
    apps:
      - "xstudio"
      - "openrv"
  #- name: "missing_media"
  #  recording: "recordings/missing_media.jsonl"
  #  script_driven: true
  #  apps:
  #    - "openrv"
  #    - "xstudio"
  - name: "text_annotations_notc"
    recording: "recordings/text_annotations_notc.jsonl"
    script_driven: false
    apps:
      - "xstudio"
      - "openrv"
